<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page introuvable – Dugos Photographie</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#ffffff" />
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 40px 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #0a0a0a;
      background: #fff;
      text-align: center;
    }
    .wordmark {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 700;
      font-size: clamp(28px, 8vw, 44px);
      letter-spacing: 0.14em;
    }
    .code { font-size: 12px; letter-spacing: 0.32em; color: #bbb; text-transform: uppercase; }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-size: clamp(26px, 6vw, 44px);
      line-height: 1.15;
    }
    p { color: #555; font-weight: 300; max-width: 34ch; }
    a.home {
      margin-top: 8px;
      display: inline-block;
      padding: 13px 28px;
      background: #0a0a0a;
      color: #fff;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    a.home:hover { background: #333; }
  </style>
</head>
<body>
  <p class="wordmark">DUGOS</p>
  <p class="code">Erreur 404</p>
  <h1>Cette page n'existe pas</h1>
  <p>Le lien est peut-être incorrect ou la page a été déplacée.</p>
  <a class="home" href="/dugos-photo/">Retour à l'accueil</a>
</body>
</html>
